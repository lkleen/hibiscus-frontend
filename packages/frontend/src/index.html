<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Applies theme-light/theme-dark to <html> before first paint, to avoid a flash of the
      // wrong theme. This is a hand-ported copy of
      // src/app/core/utils/theme-resolution.ts (resolveInitialTheme) — it must run synchronously
      // before Angular bootstraps, so it can't import that module. Both copies implement the same
      // bm-theme localStorage + 1-hour TTL + OS-preference fallback algorithm and MUST be changed
      // together.
      (function () {
        var ONE_HOUR_MS = 60 * 60 * 1000;
        var theme = null;
        try {
          var raw = localStorage.getItem('bm-theme');
          if (raw) {
            var parsed = JSON.parse(raw);
            var age = Date.now() - (parsed && parsed.savedAt);
            if (
              parsed &&
              (parsed.theme === 'light' || parsed.theme === 'dark') &&
              typeof parsed.savedAt === 'number' &&
              age >= 0 &&
              age < ONE_HOUR_MS
            ) {
              theme = parsed.theme;
            }
          }
        } catch (e) {
          // localStorage unavailable — fall through to OS preference below.
        }
        if (!theme) {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        document.documentElement.classList.add('theme-' + theme);
      })();
    </script>
    <title>Hibiscus</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
