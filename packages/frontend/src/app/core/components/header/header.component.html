<header class="header">
  <div class="header__brand">
    <span class="header__brand-name">Hibiscus</span>
  </div>

  <nav class="header__nav" [attr.aria-label]="i18n.t('nav.main')">
    @for (link of navLinks; track link.path) {
      <a
        class="header__nav-link"
        [routerLink]="['/', locale(), link.path]"
        routerLinkActive="header__nav-link--active"
      >
        {{ i18n.t(link.labelKey) }}
      </a>
    }
  </nav>

  <div class="header__actions">
    <app-dark-mode-toggle />
    <app-user-menu />
  </div>
</header>
