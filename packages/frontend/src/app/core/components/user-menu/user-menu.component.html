<button
  type="button"
  class="user-menu__trigger"
  [cdkMenuTriggerFor]="panelTemplate"
  [cdkMenuPosition]="panelPositions"
  [attr.aria-label]="ariaLabel()"
>
  <svg
    class="user-menu__icon"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <circle cx="12" cy="8" r="3.5" />
    <path d="M4.5 19.5c1.5-3.5 4.5-5.5 7.5-5.5s6 2 7.5 5.5" />
  </svg>
</button>

<ng-template #panelTemplate>
  <div class="user-menu__panel" cdkMenu aria-label="User menu">
    @if (user(); as u) {
      <span class="user-menu__identity">Logged in as {{ u }}</span>
    } @else if (loadError()) {
      <span class="user-menu__identity user-menu__identity--error">Could not load identity</span>
    } @else {
      <span class="user-menu__identity">Loading identity…</span>
    }

    <div class="user-menu__separator" role="separator"></div>

    <button
      type="button"
      class="user-menu__item user-menu__theme-trigger"
      cdkMenuItem
      [cdkMenuTriggerFor]="themeMenu"
      [cdkMenuPosition]="submenuPositions"
    >
      <span class="user-menu__item-lead">
        <svg
          class="user-menu__glyph"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m15 6-6 6 6 6" />
        </svg>
      </span>
      <span class="user-menu__item-label">Theme</span>
      <span class="user-menu__item-value">{{ themeLabel() }}</span>
    </button>
  </div>
</ng-template>

<ng-template #themeMenu>
  <div class="user-menu__panel" cdkMenu aria-label="Theme">
    @for (option of themeOptions; track option.name) {
      <button
        type="button"
        class="user-menu__item user-menu__theme-option"
        cdkMenuItemRadio
        [cdkMenuItemChecked]="theme() === option.name"
        (cdkMenuItemTriggered)="setTheme(option.name)"
      >
        <span class="user-menu__item-lead">
          @if (theme() === option.name) {
            <svg
              class="user-menu__glyph user-menu__glyph--check"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m5 12.5 4.5 4.5L19 7.5" />
            </svg>
          }
        </span>
        <span class="user-menu__item-label">{{ option.label }}</span>
      </button>
    }
  </div>
</ng-template>
