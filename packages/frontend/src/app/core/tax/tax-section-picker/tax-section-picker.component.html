<button
  type="button"
  class="tax-section-picker__trigger"
  [class.tax-section-picker__trigger--muted]="muted()"
  cdkOverlayOrigin
  #origin="cdkOverlayOrigin"
  aria-haspopup="listbox"
  [attr.aria-expanded]="isOpen()"
  [attr.aria-label]="ariaLabel()"
  (click)="onTriggerClick($event)"
  (keydown)="onTriggerKeydown($event)"
>
  @if (selected().code; as code) {
    <app-tax-code [code]="code" />
  }
  <span class="tax-section-picker__trigger-label">{{ selected().label }}</span>
  <svg
    class="tax-section-picker__chevron"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="m6 9 6 6 6-6" />
  </svg>
</button>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="isOpen()"
  [cdkConnectedOverlayPositions]="panelPositions"
  [cdkConnectedOverlayPush]="true"
  cdkConnectedOverlayHasBackdrop
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  (backdropClick)="close()"
  (detach)="close()"
>
  <div class="tax-section-picker__popup" cdkTrapFocus cdkTrapFocusAutoCapture>
    <div
      class="tax-section-picker__list"
      role="listbox"
      tabindex="0"
      [attr.aria-label]="ariaLabel()"
      [attr.aria-activedescendant]="optionId(activeIndex())"
      (keydown)="onListKeydown($event)"
      (click)="onListPointer($event, true)"
      (pointermove)="onListPointer($event, false)"
    >
      @for (option of options(); track option.value; let index = $index) {
        <div
          class="tax-section-picker__option"
          role="option"
          [id]="optionId(index)"
          [class.tax-section-picker__option--active]="index === activeIndex()"
          [class.tax-section-picker__option--muted]="option.inherited === true"
          [attr.aria-selected]="option.value === value()"
          [attr.aria-disabled]="option.disabled === true ? true : null"
          [attr.aria-describedby]="
            index === activeIndex() && option.description !== null ? tipId : null
          "
          [attr.data-index]="index"
        >
          @if (option.code; as code) {
            <app-tax-code [code]="code" />
          }
          <span class="tax-section-picker__option-label">{{ option.label }}</span>
        </div>
      }
    </div>
    <!-- A sibling of the list, not an overlay on it: it never covers an option, so it cannot block a click. -->
    @if (active().description; as description) {
      <app-tax-description
        class="tax-section-picker__tip"
        role="tooltip"
        [id]="tipId"
        [description]="description"
      />
    }
  </div>
</ng-template>
