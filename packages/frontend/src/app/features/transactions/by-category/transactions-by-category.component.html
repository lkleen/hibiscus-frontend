@if (invalidPatternNames(); as names) {
  <p class="by-category__warning" role="status">
    {{ i18n.t('transactions.byCategory.invalidPatterns', { names }) }}
  </p>
}
<app-data-table
  [value]="rows()"
  [columns]="columns"
  [options]="options"
  [loading]="store.loading()"
  [density]="densities.densityFor(densityView)()"
  [(selectedRowIds)]="selectedRowIds"
>
  <ng-template appDataTableCell="categoryName" let-row let-name="valueFormatted">
    <span class="by-category__name">
      @if (swatchColor(row); as color) {
        <span
          class="by-category__swatch"
          [style.background-color]="color"
          aria-hidden="true"
        ></span>
      }
      {{ name }}
    </span>
  </ng-template>
  <ng-template appDataTableCell="amount" let-value="value">
    <app-transaction-amount-cell [amount]="asAmount(value)" />
  </ng-template>
</app-data-table>

<ng-template
  appRibbonBand="selection-by-category"
  ribbonLabelKey="ribbon.tab.selection"
  [ribbonOrder]="100"
  [ribbonContextual]="true"
  [ribbonShown]="selectedRowIds().size > 0"
  [ribbonState]="selectedRowIds().size.toString()"
>
  <app-ribbon-group captionKey="ribbon.group.selection">
    <app-transactions-selection-bar [count]="selectedRowIds().size" (cleared)="clearSelection()" />
  </app-ribbon-group>
</ng-template>
