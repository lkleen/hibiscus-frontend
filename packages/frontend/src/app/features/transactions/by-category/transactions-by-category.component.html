@if (invalidPatternNames(); as names) {
  <p class="by-category__warning" role="status">
    {{ i18n.t('transactions.byCategory.invalidPatterns', { names }) }}
  </p>
}
<app-data-table
  [value]="rows()"
  [columns]="columns"
  [options]="options"
  [loading]="store.loading()"
>
  <ng-template appDataTableCell="categoryName" let-row let-name="valueFormatted">
    <span class="by-category__name">
      @if (swatchColor(row); as color) {
        <span
          class="by-category__swatch"
          [style.background-color]="color"
          aria-hidden="true"
        ></span>
      }
      {{ name }}
    </span>
  </ng-template>
  <ng-template appDataTableCell="amount" let-value="value">
    <app-transaction-amount-cell [amount]="asAmount(value)" />
  </ng-template>
</app-data-table>
