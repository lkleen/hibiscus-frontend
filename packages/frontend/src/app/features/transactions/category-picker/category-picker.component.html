<button
  #trigger
  type="button"
  class="category-picker__trigger"
  (click)="toggle()"
  [attr.aria-expanded]="isOpen()"
  aria-haspopup="listbox"
>
  <span
    class="category-picker__swatch"
    [style.background]="selectedCategoryColor() ?? 'transparent'"
    aria-hidden="true"
  ></span>
  <span class="category-picker__label">{{
    selectedCategory()?.name ?? i18n.t('categoryPicker.uncategorized')
  }}</span>
</button>

<ng-template #panelTemplate>
  <div
    class="category-picker__panel"
    cdkTrapFocus
    cdkTrapFocusAutoCapture
    role="listbox"
    [attr.aria-label]="i18n.t('categoryPicker.choose')"
  >
    <button
      type="button"
      class="category-picker__option"
      [class.category-picker__option--selected]="selectedCategoryId() === null"
      role="option"
      [attr.aria-selected]="selectedCategoryId() === null"
      (click)="select(null)"
    >
      {{ i18n.t('categoryPicker.uncategorized') }}
    </button>
    @for (option of flatOptions(); track option.row.id) {
      <button
        type="button"
        class="category-picker__option"
        [class.category-picker__option--selected]="selectedCategoryId() === option.row.id"
        [style.padding-inline-start.px]="12 + option.depth * 16"
        role="option"
        [attr.aria-selected]="selectedCategoryId() === option.row.id"
        (click)="select(option.row.id)"
      >
        <span
          class="category-picker__swatch"
          [style.background]="option.cssColor ?? 'var(--surface-border)'"
          aria-hidden="true"
        ></span>
        {{ option.row.name }}
      </button>
    }
  </div>
</ng-template>
