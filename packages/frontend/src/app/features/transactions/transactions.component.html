<h1>{{ i18n.t('transactions.title') }}</h1>

<app-data-table [value]="items()" [columns]="columns" [options]="options" [loading]="loading()">
  <ng-template appDataTableCell="amount" let-value="value">
    <app-transaction-amount-cell [amount]="asAmount(value)" />
  </ng-template>
  <ng-template appDataTableCell="category" let-row>
    <app-transaction-category-cell
      [transactionId]="row.id"
      [categoryId]="row.umsatztyp_id"
      [categories]="categories()"
      [failedUpdateId]="categoryUpdateErrorId()"
      (categoryChange)="onCategoryChange(row.id, $event)"
    />
  </ng-template>
</app-data-table>

@if (error()) {
  <p class="status-text status-text--error">{{ i18n.t('transactions.error') }}</p>
}
