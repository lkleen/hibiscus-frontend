<h1>{{ i18n.t('transactions.title') }}</h1>

<form class="filters" (submit)="$event.preventDefault()">
  <div class="filters__field filters__field--grow">
    <label for="filter-search">{{ i18n.t('transactions.filterSearch') }}</label>
    <input
      id="filter-search"
      type="search"
      [placeholder]="i18n.t('transactions.searchPlaceholder')"
      [value]="q()"
      (input)="onSearchInput($event)"
    />
  </div>
</form>

<app-base-table
  class="transactions__grid"
  [columnDefs]="columnDefs()"
  [defaultColDef]="defaultColDef"
  [autoSizeStrategy]="autoSizeStrategy"
  [rowData]="items()"
  [getRowId]="getRowId"
  [context]="gridContext"
  [localeText]="localeText()"
  [loading]="loading()"
  [quickFilterText]="q()"
  [cacheQuickFilter]="true"
  [suppressNoRowsOverlay]="true"
  [suppressColumnVirtualisation]="true"
  [suppressRowVirtualisation]="true"
  [pagination]="true"
  [paginationPageSize]="pageSize"
  domLayout="autoHeight"
  (gridReady)="onGridReady($event)"
/>

@if (error()) {
  <p class="status-text status-text--error">{{ i18n.t('transactions.error') }}</p>
} @else if (!loading() && items().length === 0) {
  <p class="status-text">{{ i18n.t('transactions.empty') }}</p>
}
