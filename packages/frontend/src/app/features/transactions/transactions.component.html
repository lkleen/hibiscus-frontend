<h1 class="visually-hidden">{{ i18n.t('transactions.title') }}</h1>

<app-tab-nav
  [tabs]="tabs"
  [basePath]="['/', locale(), 'transactions']"
  ariaLabelKey="transactions.tabs.label"
/>

<app-ribbon ribbonId="transactions" />

<ng-template
  appRibbonBand="filter"
  ribbonLabelKey="ribbon.tab.filter"
  [ribbonOrder]="0"
  [ribbonState]="store.accountsText()"
  [ribbonActive]="filterActive()"
>
  <app-ribbon-group captionKey="ribbon.group.search" [grow]="true">
    <div class="filters__field filters__field--grow">
      <label class="visually-hidden" for="transactions-search">{{
        i18n.t('table.filterSearch')
      }}</label>
      <input
        id="transactions-search"
        type="search"
        [placeholder]="i18n.t('table.searchPlaceholder')"
        [value]="store.searchInput()"
        (input)="onSearchInput($event)"
      />
    </div>
  </app-ribbon-group>
  <app-ribbon-group captionKey="ribbon.group.accounts">
    <app-account-filter [accounts]="store.accounts()" [(excludedIds)]="store.excludedAccountIds" />
  </app-ribbon-group>
</ng-template>

<ng-template
  appRibbonBand="period"
  ribbonLabelKey="ribbon.tab.period"
  [ribbonOrder]="1"
  [ribbonState]="store.periodText()"
>
  <app-date-range-filter [(range)]="store.range" />
</ng-template>

<ng-template appRibbonBand="view" ribbonLabelKey="ribbon.tab.view" [ribbonOrder]="2">
  @if (activeTab().hasTree) {
    <app-ribbon-group captionKey="ribbon.group.tree">
      <!-- The routed tab's tree controls (expand/collapse all) are attached here. -->
      <ng-template cdkPortalOutlet />
    </app-ribbon-group>
  }
  <app-ribbon-group captionKey="ribbon.group.density">
    <app-density-picker [view]="activeTab().densityView" />
  </app-ribbon-group>
</ng-template>

<ng-template appRibbonBand="export" ribbonLabelKey="ribbon.tab.export" [ribbonOrder]="3">
  <app-ribbon-group captionKey="ribbon.group.export">
    <button type="button" class="filters__action" (click)="exporter.open()">
      {{ i18n.t('transactions.export.open') }}
    </button>
  </app-ribbon-group>
</ng-template>

<router-outlet />

@if (store.error()) {
  <p class="status-text status-text--error">{{ i18n.t('transactions.error') }}</p>
}
