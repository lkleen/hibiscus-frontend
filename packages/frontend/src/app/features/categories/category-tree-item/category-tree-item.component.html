<div class="tree-item__row" [style.padding-inline-start.px]="depth() * 20">
  @if (editing()) {
    <input #nameInput class="tree-item__name-input" type="text" [value]="node().name" />
    <input
      #colorInput
      class="tree-item__color-input"
      type="color"
      [value]="node().color ?? '#94a3b8'"
    />
    <select #parentSelect class="tree-item__parent-select" [value]="parentSelectValue()">
      <option value="">{{ i18n.t('categories.noParent') }}</option>
      @for (candidate of selectableParents(); track candidate.id) {
        <option [value]="candidate.id.toString()">{{ candidate.name }}</option>
      }
    </select>
    <button
      type="button"
      class="tree-item__btn tree-item__btn--primary"
      (click)="save(nameInput.value, colorInput.value, parentSelect.value)"
    >
      {{ i18n.t('categoryTree.save') }}
    </button>
    <button type="button" class="tree-item__btn" (click)="cancelEdit()">
      {{ i18n.t('categoryTree.cancel') }}
    </button>
  } @else {
    <span
      class="tree-item__swatch"
      [style.background]="node().color ?? 'var(--surface-border)'"
      aria-hidden="true"
    ></span>
    <span class="tree-item__name">{{ node().name }}</span>
    <div class="tree-item__actions">
      <button type="button" class="tree-item__btn" (click)="startEdit()">
        {{ i18n.t('categoryTree.edit') }}
      </button>
      <button type="button" class="tree-item__btn" (click)="addChild.emit(node().id)">
        {{ i18n.t('categoryTree.addChild') }}
      </button>
      <button
        type="button"
        class="tree-item__btn tree-item__btn--danger"
        (click)="remove.emit(node().id)"
      >
        {{ i18n.t('categoryTree.delete') }}
      </button>
    </div>
  }
</div>

@if (node().children.length > 0) {
  <ul class="tree-item__children">
    @for (child of node().children; track child.id) {
      <li>
        <app-category-tree-item
          [node]="child"
          [allCategories]="allCategories()"
          [depth]="depth() + 1"
          (update)="update.emit($event)"
          (addChild)="addChild.emit($event)"
          (remove)="remove.emit($event)"
        />
      </li>
    }
  </ul>
}
