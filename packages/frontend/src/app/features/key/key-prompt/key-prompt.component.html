<header class="app-dialog__header">
  <h2 class="app-dialog__title" [id]="titleId">{{ i18n.t('keyPrompt.title') }}</h2>
</header>

<form class="app-dialog__body" (submit)="$event.preventDefault(); submit()">
  <p class="app-dialog__hint">
    {{ i18n.t(data.offerKeepUnlocked ? 'keyPrompt.hintMemory' : 'keyPrompt.hintManual') }}
  </p>

  <div class="key-prompt__field">
    <label class="app-dialog__sublabel" [for]="inputId">{{ i18n.t('keyPrompt.label') }}</label>
    <input
      class="app-dialog__select key-prompt__input"
      type="password"
      autocomplete="off"
      spellcheck="false"
      cdkFocusInitial
      [id]="inputId"
      [value]="key()"
      [disabled]="busy()"
      [attr.aria-invalid]="invalid() ? 'true' : null"
      [attr.aria-describedby]="invalid() ? 'key-prompt-error' : null"
      (input)="onKey($event)"
    />
  </div>

  @if (data.offerKeepUnlocked) {
    <label class="key-prompt__check">
      <input
        class="app-dialog__radio"
        type="checkbox"
        [checked]="keepUnlocked()"
        [disabled]="busy()"
        (change)="onKeep($event)"
      />
      <span>{{ i18n.t('keyPrompt.keepUnlocked') }}</span>
    </label>
  }

  @if (invalid()) {
    <p class="app-dialog__error" id="key-prompt-error" role="alert">
      {{ i18n.t('keyPrompt.invalid') }}
    </p>
  }
</form>

<footer class="app-dialog__footer">
  <button type="button" class="app-dialog__button" [disabled]="busy()" (click)="cancel()">
    {{ i18n.t('keyPrompt.cancel') }}
  </button>
  <button
    type="button"
    class="app-dialog__button app-dialog__button--primary"
    [disabled]="busy() || key().trim() === ''"
    (click)="submit()"
  >
    {{ i18n.t(busy() ? 'keyPrompt.working' : 'keyPrompt.confirm') }}
  </button>
</footer>
