<div class="tax-wizard__yearbar">
  <h1 class="tax-wizard__title">{{ i18n.t('tax.wizard.title', { year: year() }) }}</h1>
  <span class="tax-muted">{{ store.transactions.accountsText() }}</span>
  <a class="tax-wizard__change" [routerLink]="['/', locale(), 'tax-return']">{{
    i18n.t('tax.wizard.change')
  }}</a>
</div>

<nav class="tax-wizard__nav" [attr.aria-label]="i18n.t('tax.wizard.stepsLabel')">
  <ol class="tax-steps">
    @for (item of steps(); track item.step) {
      <li class="tax-steps__item" [class.tax-steps__item--done]="item.step < step()">
        <button
          type="button"
          class="tax-steps__button"
          [attr.aria-current]="item.step === step() ? 'step' : null"
          [disabled]="!item.reachable"
          (click)="go(item.step)"
        >
          <span class="tax-steps__number" aria-hidden="true">{{ item.step }}</span>
          <span class="tax-steps__label">
            {{ i18n.t(item.labelKey) }}
            <small class="tax-steps__detail">{{ item.detail }}</small>
          </span>
        </button>
      </li>
    }
  </ol>
</nav>

@switch (step()) {
  @case (1) {
    <app-tax-step-categories (go)="go($event)" />
  }
  @case (2) {
    <app-tax-step-unassigned (go)="go($event)" />
  }
  @case (3) {
    <app-tax-step-check (go)="go($event)" />
  }
  @case (4) {
    <app-tax-step-result />
  }
}

<p class="tax-note">{{ i18n.t('tax.disclaimer') }}</p>
