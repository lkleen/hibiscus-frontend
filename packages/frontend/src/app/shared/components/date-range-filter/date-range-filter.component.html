<div class="date-range-filter">
  <div class="date-range-filter__field">
    <label [for]="id + '-preset'">{{ i18n.t('dateRangeFilter.period') }}</label>
    <button
      type="button"
      class="date-range-filter__trigger"
      [id]="id + '-preset'"
      [cdkMenuTriggerFor]="panelTemplate"
      [cdkMenuPosition]="panelPositions"
      (cdkMenuOpened)="onMenuOpened()"
    >
      <span class="date-range-filter__trigger-label">{{ triggerLabel() }}</span>
      <svg
        class="date-range-filter__chevron"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="m6 9 6 6 6-6" />
      </svg>
    </button>
  </div>

  <div class="date-range-filter__field">
    <label [for]="id + '-from'">{{ i18n.t('dateRangeFilter.from') }}</label>
    <!-- No [value]/[min]/[max] bindings: the component writes these itself, never into the field
         being typed in (see `typedRange`). -->
    <input #fromInput type="date" [id]="id + '-from'" (input)="onFromInput($event)" />
  </div>

  <div class="date-range-filter__field">
    <label [for]="id + '-to'">{{ i18n.t('dateRangeFilter.to') }}</label>
    <input #toInput type="date" [id]="id + '-to'" (input)="onToInput($event)" />
  </div>
</div>

<ng-template #panelTemplate>
  <div
    class="date-range-filter__panel"
    cdkMenu
    [attr.aria-label]="i18n.t('dateRangeFilter.period')"
  >
    @if (loadError()) {
      <span class="date-range-filter__error">{{ i18n.t('dateRangeFilter.loadError') }}</span>
    }
    @for (item of items(); track item.preset.id) {
      <button
        type="button"
        class="date-range-filter__item"
        cdkMenuItemRadio
        [cdkMenuItemChecked]="selectedPreset()?.id === item.preset.id"
        (cdkMenuItemTriggered)="selectPreset(item.preset)"
      >
        <span class="date-range-filter__item-lead">
          @if (selectedPreset()?.id === item.preset.id) {
            <svg
              class="date-range-filter__glyph"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m5 12.5 4.5 4.5L19 7.5" />
            </svg>
          }
        </span>
        <span class="date-range-filter__item-label">{{ item.label }}</span>
        <span class="date-range-filter__item-dates">{{ item.dates }}</span>
      </button>
    }
    <div class="date-range-filter__separator" role="separator"></div>
    <button
      type="button"
      class="date-range-filter__item"
      cdkMenuItemRadio
      [cdkMenuItemChecked]="allDatesSelected()"
      (cdkMenuItemTriggered)="selectAllDates()"
    >
      <span class="date-range-filter__item-lead">
        @if (allDatesSelected()) {
          <svg
            class="date-range-filter__glyph"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m5 12.5 4.5 4.5L19 7.5" />
          </svg>
        }
      </span>
      <span class="date-range-filter__item-label">{{ i18n.t('dateRangeFilter.allDates') }}</span>
    </button>
  </div>
</ng-template>
