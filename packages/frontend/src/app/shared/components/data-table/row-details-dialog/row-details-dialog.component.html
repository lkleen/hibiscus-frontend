<header class="data-table-details__header">
  <h2 class="data-table-details__title" [id]="titleId">{{ i18n.t('table.rowDetailsTitle') }}</h2>
  <button type="button" class="data-table-details__close" (click)="close()">
    {{ i18n.t('table.close') }}
  </button>
</header>

<dl class="data-table-details__list">
  @for (column of data.columns; track column.colId) {
    <div class="data-table-details__entry">
      <dt class="data-table-details__label">{{ i18n.t(column.headerKey) }}</dt>
      <dd class="data-table-details__value">
        <ng-container
          [ngTemplateOutlet]="data.cellContent"
          [ngTemplateOutletContext]="{ column: column, row: data.row }"
        />
      </dd>
    </div>
  }
</dl>
